name: CI

on:
  push:
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit and red-team tests (build fails on any unsafe reply)
        run: npm test
      - run: npm run build
      - run: npm run typecheck
